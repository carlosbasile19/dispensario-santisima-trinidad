<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.og{width:1200px;height:630px;background:#faf8f4;display:grid;grid-template-columns:640px 1fr;font-family:'Instrument Sans',sans-serif;color:#1b2a55;overflow:hidden}

.foot img{width:60px;height:60px}
.name{font-family:'Newsreader',serif;font-size:27px;line-height:1.1}
.meta{font-size:17px;color:#5a5e69;margin-top:4px}
.photo{padding:40px 40px 40px 0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:60% center;border-radius:10px}
</style></head><body>
<div class="og">
  <div class="copy">
    <div class="eyebrow">CENTRO MÉDICO INTEGRAL · CIUDAD BOLÍVAR</div>

    <div class="services">Consultas · Ecosonograma · Electrocardiograma · Laboratorio</div>
    <div class="foot">
      <img src="icon.svg" alt="">
      <div><div class="name">Santísima Trinidad</div><div class="meta">Lun–Vie desde 7:30am · 0412-8261258</div></div>
    </div>
  </div>
  <div class="photo"><img src="../../public/images/hero.jpg" alt=""></div>
</div></body></html>
